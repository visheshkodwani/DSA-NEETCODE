<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ec7'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0e1f">
<script>
/* Color the plain ``` example blocks (Input/Output) with the same token classes Rouge uses. Block comment: the theme minifies HTML onto one line. */
document.addEventListener("DOMContentLoaded", () => {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const tok = /(^\s*(?:Input|Output|Explanation)\s*:)|("[^"]*")|(-?\d+(?:\.\d+)?)|([\[\]{}(),])|(=)/gm;
  const cls = [, "k", "s", "m", "p", "o"];
  document.querySelectorAll("div.language-plaintext code").forEach((el) => {
    el.innerHTML = esc(el.textContent).replace(tok, (m, ...g) =>
      `<span class="${cls[g.findIndex((x) => x !== undefined) + 1]}">${m}</span>`);
  });
});
/* Dry runs as slides: show one .arr-step at a time with prev / play / next, dots, and arrow keys. */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".viz").forEach((viz) => {
    const steps = [...viz.querySelectorAll(".arr-step")];
    if (steps.length < 2) return;
    const stage = document.createElement("div");
    stage.className = "viz-stage";
    steps[0].before(stage);
    stage.append(...steps);
    const nav = document.createElement("div");
    nav.className = "viz-nav";
    nav.innerHTML = `<button type="button" aria-label="Previous step">‹</button><span class="viz-dots">${steps.map((_, k) => `<button type="button" aria-label="Step ${k + 1}"></button>`).join("")}</span><span class="viz-count"></span><button type="button" class="viz-play" aria-label="Play">▶</button><button type="button" aria-label="Next step">›</button>`;
    viz.append(nav);
    viz.classList.add("slides");
    viz.tabIndex = 0;
    const [prev, , , play, next] = nav.children;
    const dots = [...nav.querySelectorAll(".viz-dots button")];
    let cur = 0, timer = null;
    const show = (k) => {
      cur = (k + steps.length) % steps.length;
      steps.forEach((s, x) => s.classList.toggle("on", x === cur));
      dots.forEach((d, x) => d.classList.toggle("on", x === cur));
      nav.querySelector(".viz-count").textContent = `${cur + 1} / ${steps.length}`;
    };
    const stop = () => { clearInterval(timer); timer = null; play.textContent = "▶"; play.setAttribute("aria-label", "Play"); };
    const go = (k) => { stop(); show(k); };
    prev.onclick = () => go(cur - 1);
    next.onclick = () => go(cur + 1);
    dots.forEach((d, k) => (d.onclick = () => go(k)));
    play.onclick = () => {
      if (timer) return stop();
      if (cur === steps.length - 1) show(0);
      play.textContent = "❚❚";
      play.setAttribute("aria-label", "Pause");
      timer = setInterval(() => (cur === steps.length - 1 ? stop() : show(cur + 1)), 1400);
    };
    viz.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
    });
    show(0);
  });
});
</script>
