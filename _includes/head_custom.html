<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6ec7'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Arial' font-weight='700' font-size='30' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0b0e1f">
<script>
/* Color the plain ``` example blocks (Input/Output) with the same token classes Rouge uses. Block comment: the theme minifies HTML onto one line. */
document.addEventListener("DOMContentLoaded", () => {
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const tok = /(^\s*(?:Input|Output|Explanation)\s*:)|("[^"]*")|(-?\d+(?:\.\d+)?)|([\[\]{}(),])|(=)/gm;
  const cls = [, "k", "s", "m", "p", "o"];
  document.querySelectorAll("div.language-plaintext code").forEach((el) => {
    el.innerHTML = esc(el.textContent).replace(tok, (m, ...g) =>
      `<span class="${cls[g.findIndex((x) => x !== undefined) + 1]}">${m}</span>`);
  });
});
/* Dry runs as a step player. Each array.html / matrix.html include is one step; join=true puts it on the previous step's slide. ptr, name and vars are drawn here. */
document.addEventListener("DOMContentLoaded", () => {
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const pairs = (s) => (s || "").split(",").filter(Boolean).map((p) => p.split("=").map((x) => x.trim()));
  const icon = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
  const PLAY = icon("M7 5l12 7-12 7z"), PAUSE = icon("M8 5v14M16 5v14");
  document.querySelectorAll(".arr-step").forEach((step) => {
    const grid = step.querySelector(".arr, .mat");
    const cells = step.querySelectorAll(".cell");
    pairs(step.dataset.ptr).forEach(([name, k]) => {
      const c = cells[+k];
      if (!c) return;
      const tag = c.querySelector(".ptr") || c.appendChild(el("em", "ptr"));
      tag.textContent = tag.textContent ? `${tag.textContent}, ${name}` : name;
      grid.classList.add("has-ptr");
    });
    if (step.dataset.vars) grid.after(el("span", "vars", pairs(step.dataset.vars).map(([k, v]) => `<span><i>${k} =</i>${v}</span>`).join("")));
    if (step.dataset.name) step.prepend(el("span", "arr-name", step.dataset.name));
  });
  document.querySelectorAll(".viz").forEach((viz) => {
    const steps = [...viz.querySelectorAll(".arr-step")];
    const groups = [];
    steps.forEach((s) => (s.classList.contains("join") && groups.length ? groups[groups.length - 1].push(s) : groups.push([s])));
    if (groups.length < 2) return;
    const stage = el("div", "viz-stage");
    steps[0].before(stage);
    const slides = groups.map((g) => {
      const slide = el("div", "viz-slide"), desc = el("div", "viz-desc");
      g.forEach((s) => {
        const panel = el("div", "viz-panel");
        panel.append(...s.querySelectorAll(":scope > .arr-name, :scope > .arr, :scope > .mat, :scope > .vars"));
        slide.append(panel);
        const label = s.querySelector(".arr-label"), note = s.querySelector(".arr-note");
        if (label) desc.append(el("b", null, label.innerHTML));
        if (note) desc.append(el("span", null, note.innerHTML));
        s.remove();
      });
      if (desc.childElementCount) slide.append(desc);
      stage.append(slide);
      return slide;
    });
    const n = slides.length;
    let h = viz.previousElementSibling;
    while (h && h.tagName !== "H2") h = h.previousElementSibling;
    const t = h ? h.textContent.split(",")[0].trim() : "Dry run";
    const head = el("div", "viz-head", `<span class="viz-title"></span><span class="viz-count"></span>`);
    head.firstChild.textContent = t === "Dry run" ? "Your solution" : t;
    const bar = el("div", "viz-bar",
      `<button type="button" aria-label="Previous step">${icon("M6 5v14M18 5 8 12l10 7z")}</button>` +
      `<button type="button" class="viz-play" aria-label="Play">${PLAY}</button>` +
      `<button type="button" aria-label="Next step">${icon("M18 5v14M6 5l10 7-10 7z")}</button>` +
      `<span class="viz-speed"><button type="button" data-s="2">0.5x</button><button type="button" data-s="1" class="on">1x</button><button type="button" data-s="0.5">2x</button></span>`);
    const track = el("div", "viz-track", `<div class="viz-fill"></div>${slides.map((_, k) => `<span class="viz-tick" style="left:${(k / (n - 1)) * 100}%"></span>`).join("")}<span class="viz-knob"></span>`);
    viz.prepend(head, bar, track);
    viz.classList.add("slides");
    viz.tabIndex = 0;
    const [prev, play, next] = bar.children;
    const speeds = [...bar.querySelectorAll(".viz-speed button")];
    const ticks = [...track.querySelectorAll(".viz-tick")];
    const fill = track.querySelector(".viz-fill"), knob = track.querySelector(".viz-knob");
    let cur = 0, timer = null, speed = 1;
    const show = (k) => {
      cur = Math.max(0, Math.min(n - 1, k));
      slides.forEach((s, x) => s.classList.toggle("on", x === cur));
      ticks.forEach((tk, x) => tk.classList.toggle("on", x <= cur));
      fill.style.width = knob.style.left = `${(cur / (n - 1)) * 100}%`;
      head.lastChild.textContent = `Step ${cur + 1} / ${n}`;
    };
    const stop = () => { clearInterval(timer); timer = null; play.innerHTML = PLAY; play.setAttribute("aria-label", "Play"); };
    const start = () => {
      clearInterval(timer);
      play.innerHTML = PAUSE;
      play.setAttribute("aria-label", "Pause");
      timer = setInterval(() => (cur === n - 1 ? stop() : show(cur + 1)), 1400 * speed);
    };
    const go = (k) => { stop(); show(k); };
    prev.onclick = () => go(cur - 1);
    next.onclick = () => go(cur + 1);
    play.onclick = () => {
      if (timer) return stop();
      if (cur === n - 1) show(0);
      start();
    };
    speeds.forEach((b) => (b.onclick = () => {
      speed = +b.dataset.s;
      speeds.forEach((x) => x.classList.toggle("on", x === b));
      if (timer) start();
    }));
    track.onclick = (e) => {
      const r = track.getBoundingClientRect();
      go(Math.round(((e.clientX - r.left) / r.width) * (n - 1)));
    };
    viz.addEventListener("keydown", (e) => {
      if (e.target !== viz) return;
      if (e.key === "ArrowRight") { e.preventDefault(); go(cur + 1); }
      if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
      if (e.key === " ") { e.preventDefault(); play.click(); }
    });
    show(0);
  });
});
</script>
